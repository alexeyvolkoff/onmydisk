<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{APPTITLE} &mdash; Offline</title>
<link rel="icon" href="/customtheme/favicon.ico">
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f4f6f8;color:#2c3e50;">
  <div style="max-width:420px;width:100%;margin:24px;padding:40px 32px;background:#ffffff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.08);text-align:center;">
    <div style="font-size:28px;font-weight:600;margin:0 0 8px;color:#1a73e8;">{APPTITLE}</div>
    <h1 style="font-size:20px;margin:0 0 12px;">The server is offline</h1>
    <p style="line-height:1.5;margin:0 0 8px;color:#5f6368;">This site is currently offline, or the page you requested cannot be found.</p>
    <p style="font-family:Consolas,'Liberation Mono',monospace;font-size:13px;color:#80868b;word-break:break-all;margin:0;">{SERVER}</p>
    <a href="/" style="display:inline-block;margin-top:20px;padding:10px 24px;background:#1a73e8;color:#ffffff;border:none;border-radius:8px;font-size:14px;text-decoration:none;">Try again</a>
    <div style="margin-top:24px;font-size:12px;color:#9aa0a6;">{COMPANY} &middot; {APPTITLE} {VERSION}</div>
  </div>
</body>
</html>
