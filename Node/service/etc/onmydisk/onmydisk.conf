[Devices]
IgnoredDevices="/dev/mmcblk0,/dev/zram"

[FileNode]
Enabled=true
Network=true
Secure=false


[Network]
CA=ssl/rootCA.crt
Cert=ssl/user.crt
pKey=ssl/user.key
TreatSslErrorsAsWarnings=true
host=onmydisk.net
pKeyPass='onmydisk'
port=9000
restPort=443
restUrl=https://onmydisk.net/pki
wsPort=8899
connect=true


[logging]
bufferSize=100
maxBackups=2
maxSize=1000000
minLevel=5
msgFormat={timestamp} {typeNr} {type} {thread} {msg}
timestampFormat=dd.MM.yyyy hh:mm:ss.zzz

