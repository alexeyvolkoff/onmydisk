[Devices]
IgnoredDevices="/dev/mmcblk0,/dev/zram"

[FileNode]
Port=8081
Secure=false

[Network]
CA=ssl/rootCA.crt
Cert=ssl/user.crt
TreatSslErrorsAsWarnings=true
connect=true
pKey=ssl/user.key
pKeyPass='onmydisk'


[logging]
bufferSize=100
maxBackups=2
maxSize=1000000
minLevel=5
msgFormat={timestamp} {typeNr} {type} {thread} {msg}
timestampFormat=dd.MM.yyyy hh:mm:ss.zzz

[sessions]
cookieComment=On My Disk local user
cookieName=sessionid
cookiePath=/
expirationTime=3600000

[templates]
cacheSize=1000000
cacheTime=60000
encoding=UTF-8
suffix=.html
