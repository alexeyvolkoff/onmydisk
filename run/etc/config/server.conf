[General]
PID=/tmp/onmydisk.pid
docRoot=/srv/www
smtphost=smtp.example.com
smtpport=587
smtplogin=noreply@example.com
smtppass=
smtpehlo=client

[Notifications]
Enabled=true
Port=9988
Secure=false

[Network]
port=9000
Cert=/srv/etc/ssl/link.crt
pKey=/srv/etc/ssl/link.key
pKeyPass=onmydisk

[FileNode]
Enabled=true
Network=true
Localhost=false
Port=8081
Secure=false


[PKI]
LegacyCA=/srv/etc/pki/legacy/*.crt
CACert=/srv/etc/pki/rootCA.crt
CAKey=/srv/etc/pki/rootCA.key
CAPass='onmydisk_pki'


[templates]
cacheSize=1000000
cacheTime=60000
encoding=UTF-8
suffix=.html


[logging]
logFile=../logs/omd-server.log
minLevel=0
bufferSize=100
maxSize=1000000
maxBackups=2
timestampFormat=dd.MM.yyyy hh:mm:ss.zzz
msgFormat={timestamp} {typeNr} {type} {thread} {msg}



[AuthDB]
driver=QSQLITE
database=/srv/etc/config/onmydisk.db
