[General]
docRoot=/srv/www
IndexFiles="index.html,index.htm,default.htm,default.html,iisstart.htm"
SharedIndexFiles=shared.html
AutoIndex=true
SingleThread=false
iconDir=/srv/www/mimetypes
PID=/tmp/onmydisk.pid
smtphost=smtp.example.com
smtpport=587
smtplogin=noreply@example.com
smtppass=
smtpehlo=client

[Notifications]
Enabled=true
Port=9988
Secure=false

[Network]
port=9000
Cert=/home/alexey/projects/onmydisk/run/etc/ssl/link.crt
pKey=/home/alexey/projects/onmydisk/run/etc/ssl/link.key
pKeyPass=onmydisk

[FileNode]
Enabled=true
Network=true
Localhost=false
Port=8080
Secure=false


[PKI]
LegacyCA=/home/alexey/projects/onmydisk/run/etc/pki/legacy/*.crt
CACert=/home/alexey/projects/onmydisk/run/etc/pki/rootCA.crt
CAKey=/home/alexey/projects/onmydisk/run/etc/pki/rootCA.key
CAPass='onmydisk_pki'


[templates]
cacheSize=1000000
cacheTime=60000
encoding=UTF-8
suffix=.html


[logging]
logFile=../logs/omd-server.log
minLevel=0
bufferSize=100
maxSize=1000000
maxBackups=2
timestampFormat=dd.MM.yyyy hh:mm:ss.zzz
msgFormat={timestamp} {typeNr} {type} {thread} {msg}



[AuthDB]
driver=QSQLITE
database=/home/alexey/projects/onmydisk/run/etc/onmydisk_local.db
authtable=onmydisk
pkeystable=onmydisk_pkeys
activatetable=onmydisk_activate
