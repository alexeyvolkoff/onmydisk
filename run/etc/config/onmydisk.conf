[General]
AiServer=http://localhost:4000

[Network]
CA=ssl/rootCA.crt
Cert=ssl/user.crt
TreatSslErrorsAsWarnings=true
host=direct.onmydisk.net
pKey=ssl/user.key
port=9010
restPort=443
restUrl=https://direct.onmydisk.net/rest
wsPort=9989

[Settings]
server=direct.onmydisk.net
port=9010

[files]
cacheSize=1000000
cacheTime=60000
encoding=UTF-8
maxAge=90000
maxCachedFileSize=65536

[listener]
maxMultiPartSize=10000000
maxRequestSize=16000
maxThreads=100
minThreads=4
port=43451
readTimeout=60000

[logging]
bufferSize=100
maxBackups=2
maxSize=1000000
minLevel=0
msgFormat={timestamp} {typeNr} {type} {thread} {msg}
timestampFormat=dd.MM.yyyy hh:mm:ss.zzz


[sessions]
cookieComment=On My Disk local user
cookieName=sessionid
cookiePath=/
expirationTime=3600000

[templates]
cacheSize=1000000
cacheTime=60000
encoding=UTF-8
suffix=.html
