  # Prebuilt arm64 libdatachannel/juice/usrsctp live on the runner at
  # /opt/omd-libdatachannel/arm64 (already built, NOT rebuilt here).
  - mkdir -p build_arm64
  - pushd build_arm64
  - 'eval $QMAKE_FIREFLY CONFIG+=DEPLOY DEFINES+=_ISOC23_SOURCE=0 DEFINES+=P2P_ENABLED DEFINES+=RTC_STATIC LDATACHANNEL_ROOT=/opt/omd-libdatachannel/arm64 BUILD_VERSION=$CI_PIPELINE_ID ../Node.pro'
  - make
  - popd
  - pushd Node
  - fpm -s dir -t deb -a arm64 -n onmydisk-connector --description "On My Disk Connector" --depends "samba,udisks2,libstdc++6,libgl1,libegl1,libglu1-mesa,libxcb-xkb1,libxcb-xinerama0,libxcb-xinput0,libz1,libxkbcommon0,libxkbcommon-x11-0,libxrender1,libtag1v5,libpcre2-16-0,libcrypt1,ffmpeg,ruby-full,build-essential,zlib1g-dev,libqt5core5a | libqt5core5t64,libqt5network5 | libqt5network5t64,libqt5websockets5,libqt5widgets5 | libqt5widgets5t64,libqt5sql5 | libqt5sql5t64,libqt5webchannel5,poppler-utils,pandoc,rclone" --license "Apache" -v "2.1.5.$CI_PIPELINE_ID" --after-install after-install.sh -C target
  - scp onmydisk-connector_"2.1.5.$CI_PIPELINE_ID"_arm64.deb repo@forge.onmydisk.net:/opt/repo/Ubuntu/focal/onmydisk-connector-arm64.deb
  - ssh -o StrictHostKeyChecking=no repo@forge.onmydisk.net "mkdir -p /opt/repo/OnMyDisk/Connector"
  - scp -o StrictHostKeyChecking=no onmydisk-connector_"2.1.5.$CI_PIPELINE_ID"_arm64.deb repo@forge.onmydisk.net:/opt/repo/OnMyDisk/Connector/onmydisk-connector-arm64.deb
  - popd
  tags:
  - deb
  when: manual
  artifacts:
    paths:
    - Node/*.deb
    expire_in: 1 week

deploy_connector_ota:
  stage: deploy
  tags:
    - linux
  script:
    - ssh -o StrictHostKeyChecking=no repo@forge.onmydisk.net "mkdir -p /opt/repo/OnMyDisk/Connector"
    - |
      ssh -o StrictHostKeyChecking=no repo@forge.onmydisk.net bash -c "'
        cd /opt/repo/OnMyDisk/Connector
        AMD64_SHA=\$(sha256sum onmydisk-connector-amd64.deb 2>/dev/null | cut -d\" \" -f1 || echo \"\")
        ARM64_SHA=\$(sha256sum onmydisk-connector-arm64.deb 2>/dev/null | cut -d\" \" -f1 || echo \"\")
        ARMHF_SHA=\$(sha256sum onmydisk-connector-armhf.deb 2>/dev/null | cut -d\" \" -f1 || echo \"\")
        cat <<EOF > version.json
      {
        \"version\": \"2.1.5.${CI_PIPELINE_ID}\",
        \"build\": ${CI_PIPELINE_ID},
        \"packages\": {
          \"x86_64\": {
            \"url\": \"https://forge.onmydisk.net/repo/OnMyDisk/Connector/onmydisk-connector-amd64.deb\",
            \"sha256\": \"\$AMD64_SHA\"
          },
          \"aarch64\": {
            \"url\": \"https://forge.onmydisk.net/repo/OnMyDisk/Connector/onmydisk-connector-arm64.deb\",
            \"sha256\": \"\$ARM64_SHA\"
          },
          \"armv7l\": {
            \"url\": \"https://forge.onmydisk.net/repo/OnMyDisk/Connector/onmydisk-connector-armhf.deb\",
            \"sha256\": \"\$ARMHF_SHA\"
          }
        }
      }
      EOF
      '"
  when: manual



build_direct:
  stage: build
  script:
  - pushd svar
  - npm i --legacy-peer-deps
  - npm run build
  - popd
  - rm -rf build/Node
  - docker run --rm --user $(id -u):$(id -g) -v "$(pwd)":/onmydisk onmydisk/omd-builder:latest /onmydisk/omd-tunnel/deploy/setup-libdatachannel.sh || ./omd-tunnel/deploy/setup-libdatachannel.sh
  - docker run -v $(pwd):/onmydisk --user $(id -u gitlab-runner):$(id -g gitlab-runner) -e buildversion=$CI_PIPELINE_ID -e buildproject=Gateway.pro onmydisk/omd-builder:latest
  - docker build -t onmydisk:direct .
  - docker tag onmydisk:direct onmydisk/onmydisk:direct
  - DOCKER_CONFIG=/home/gitlab-runner/docker-onmydisk docker push onmydisk/onmydisk:direct
  - sudo -u alexey git -C /home/alexey/projects/omd/onmydisk fetch origin direct
  - sudo -u alexey git -C /home/alexey/projects/omd/onmydisk push-gh ${CI_COMMIT_SHA}
  only:
    variables:
      - $CI_COMMIT_BRANCH == "direct"
  tags:
  - linux, docker
  when: manual

deploy_direct:
  stage: deploy
  only:
    variables:
      - $CI_COMMIT_BRANCH == "direct"
  dependencies: []
  script:
    - pushd svar && npm i --legacy-peer-deps && npm run build && popd
    - rm -rf build/Node
    - docker run --rm --user $(id -u):$(id -g) -v "$(pwd)":/onmydisk onmydisk/omd-builder:latest /onmydisk/omd-tunnel/deploy/setup-libdatachannel.sh || ./omd-tunnel/deploy/setup-libdatachannel.sh
    - docker run --rm --user $(id -u):$(id -g) -v $(pwd):/onmydisk -e buildversion=$CI_PIPELINE_ID -e buildproject=Gateway.pro onmydisk/omd-builder:latest
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@onmydisk.net "mkdir -p /root/direct/bin /root/direct/www"
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" docker-compose.yml $DEPLOY_USER@onmydisk.net:/root/direct/
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" coturn/ $DEPLOY_USER@onmydisk.net:/root/direct/coturn/
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" run/bin/omd-server $DEPLOY_USER@onmydisk.net:/root/direct/bin/
    - rsync -avzc -e "ssh -p 30333 -o StrictHostKeyChecking=no" --delete svar/dist/ $DEPLOY_USER@onmydisk.net:/root/direct/www/
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@onmydisk.net "cd /root/direct && docker-compose up -d onmydisk-server && docker-compose restart onmydisk-server"
    - sudo -u alexey git -C /home/alexey/projects/omd/onmydisk fetch origin direct
    - sudo -u alexey git -C /home/alexey/projects/omd/onmydisk push-gh ${CI_COMMIT_SHA}
  tags:
    - linux
  when: manual

deploy_direct_front:
  stage: deploy
