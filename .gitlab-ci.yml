build_gun_hub_docker:
  stage: build
  script:
  - pushd gun-hub
  - docker build -t omd-gun-hub:latest .
  - docker tag omd-gun-hub:latest onmydisk/omd-gun-hub:latest
  - DOCKER_CONFIG=/home/gitlab-runner/docker-onmydisk docker push onmydisk/omd-gun-hub:latest
  - popd
