build_connector_amd64_deb:
  stage: build
  script:
  # Prebuilt libdatachannel/juice/usrsctp live on the runner at
  # /opt/omd-libdatachannel (already built, NOT rebuilt here). Same git
  # ref/pin used by omd-tunnel/deploy/setup-libdatachannel.sh. P2P_ENABLED and
  # RTC_STATIC are passed explicitly so the P2P tunnel (WebRTC) is built in.
  - docker run --rm --entrypoint bash --user $(id -u):$(id -g) -v "$(pwd)":/onmydisk -v /opt/omd-libdatachannel:/opt/omd-libdatachannel:ro onmydisk/omd-builder:latest -c "cd /onmydisk && mkdir -p build && cd build && qmake-qt5 CONFIG+=DEPLOY DEFINES+=_ISOC23_SOURCE=0 DEFINES+=P2P_ENABLED DEFINES+=RTC_STATIC LDATACHANNEL_ROOT=/opt/omd-libdatachannel/x86_64 BUILD_VERSION=$CI_PIPELINE_ID ../Node.pro && make"
  - pushd Node
  - fpm -s dir -t deb -a x86_64 -n onmydisk-connector --description "On My Disk Connector" --depends "samba,udisks2,libstdc++6,libgl1,libegl1,libglu1-mesa,libxcb-xkb1,libxcb-xinerama0,libxcb-xinput0,libz1,libxkbcommon0,libxkbcommon-x11-0,libxrender1,libtag1v5,libpcre2-16-0,libcrypt1,ffmpeg,ruby-full,build-essential,zlib1g-dev,libqt5core5a | libqt5core5t64,libqt5network5 | libqt5network5t64,libqt5websockets5,libqt5widgets5 | libqt5widgets5t64,libqt5sql5 | libqt5sql5t64,libqt5webchannel5,poppler-utils,pandoc,rclone" --license "Apache" -v "2.1.5.$CI_PIPELINE_ID" --after-install after-install.sh -C target
  - scp onmydisk-connector_"2.1.5.$CI_PIPELINE_ID"_amd64.deb repo@forge.onmydisk.net:/opt/repo/Ubuntu/focal/onmydisk-connector-amd64.deb
  - ssh -o StrictHostKeyChecking=no repo@forge.onmydisk.net "mkdir -p /opt/repo/OnMyDisk/Connector"
  - scp -o StrictHostKeyChecking=no onmydisk-connector_"2.1.5.$CI_PIPELINE_ID"_amd64.deb repo@forge.onmydisk.net:/opt/repo/OnMyDisk/Connector/onmydisk-connector-amd64.deb
  - popd
  tags:
  - deb
  when: manual
  artifacts:
    paths:
    - Node/*.deb
    expire_in: 1 week


build_connector_arm64_deb:
  stage: build
  variables:
    KIT_ARCH: armv_8
    KIT_TARGET: FIREFLY
    STAGING_DIR: /opt/sysroot/firefly-arm64-sysroot-20.04/
    QMAKE_FIREFLY: /opt/firefly_qt5.15.2_arm64_20.04/host/bin/qmake
    KIT_INCLUDE: /opt/sysroot/firefly-arm64-sysroot-20.04/usr/include/
