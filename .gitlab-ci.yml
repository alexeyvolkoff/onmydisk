build_node_mxe:
  stage: build
  script:
  - export PATH=/opt/mxe/usr/bin:$PATH
  - export CCACHE_DIR="$CI_PROJECT_DIR/build-mxe-ccache"
  - ./Node/deploy/build-windows-embedded-mxe.sh
  - cp Node/deploy/install-onmydisk.ps1 run/etc/config/onmydisk.conf bin/
  - |-
    # Clone OnMyChat directly from forge.onmydisk.net
    git clone --depth 1 \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@forge.onmydisk.net/onmydisk/onmychat.git" \
        onmychat-src
    ./Node/deploy/package-onmychat-win.sh onmychat-src bin/onmychat-latest.zip
  # publish from the same runner that has repo@forge keys (same as build_tunnel_mxe)
  - 'echo "== PUBLISH 1/3 - node exe, installer, config"'
  - |-
    scp -o StrictHostKeyChecking=accept-new \
        bin/onmydisk.exe \
        repo@forge.onmydisk.net:/opt/repo/Windows/onmydisk-node-latest-x64.exe
  - |-
    scp -o StrictHostKeyChecking=accept-new \
        bin/install-onmydisk.ps1 \
        bin/onmydisk.conf \
        repo@forge.onmydisk.net:/opt/repo/Windows/
  - 'echo "== PUBLISH 2/3 - onmychat zip"'
  - |-
    if [ -f bin/onmychat-latest.zip ]; then
      scp -o StrictHostKeyChecking=accept-new \
          bin/onmychat-latest.zip \
          repo@forge.onmydisk.net:/opt/repo/Windows/
    fi
  - 'echo "== PUBLISH 3/3 - verify files on server (job fails if missing)"'
  - |-
    ssh -o StrictHostKeyChecking=accept-new repo@forge.onmydisk.net \
        "ls -la /opt/repo/Windows/ | grep -E 'onmydisk-node-latest-x64|install-onmydisk\.ps1|onmydisk\.conf|onmychat'"
  cache:
    key: libdatachannel-build-mxe
    paths:
    - libdatachannel/build-mxe/
  tags:
  - linux
  when: manual
  artifacts:
    name: omd-node-win
    paths:
    - bin/onmydisk.exe
    - bin/install-onmydisk.ps1
    - bin/onmydisk.conf
    - bin/onmychat-latest.zip
    expire_in: 1 week


# ==============================================================================
# Mobile & OTA Live Update Jobs (Capacitor)
# ==============================================================================

build-android:
  stage: mobile
  image: node:20-bookworm
  tags:
    - linux
  before_script:
    # 1. Resolve Java Runtime Environment
    - if [ -d "/home/alexey/projects/jdk-17" ]; then
        export JAVA_HOME="/home/alexey/projects/jdk-17";
        export PATH="$JAVA_HOME/bin:$PATH";
        echo "Using local user-space JDK 17";
      elif [ -x "$(command -v apt-get)" ] && [ "$(id -u)" = "0" ]; then
        apt-get update && apt-get install -y openjdk-17-jdk;
      fi
    # 2. Resolve Android SDK
    - if [ -d "/home/alexey/projects/android-sdk" ]; then
        export ANDROID_HOME="/home/alexey/projects/android-sdk";
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH";
        echo "Using local user-space Android SDK";
      elif [ -x "$(command -v apt-get)" ] && [ "$(id -u)" = "0" ]; then
        apt-get update && apt-get install -y wget unzip;
        mkdir -p /opt/android-sdk/cmdline-tools;
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip;
        unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools;
        mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest;
        export ANDROID_HOME="/opt/android-sdk";
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH";
        yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses;
        sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0";
      fi
    # 3. Build Svelte Static Frontend in svar
    #    (no pre-compressed .gz siblings: Android AAPT2 rejects foo.js.gz as a
    #     duplicate resource of foo.js — gzip is applied by the nginx proxy anyway)
    - cd svar
    - npm install --legacy-peer-deps
    - export VITE_APP_VERSION="3.0.${CI_PIPELINE_IID}"
    - COMPRESS_ASSETS=0 npm run build
    # 4. Sync Capacitor Web Assets to Native Project
    - cd ../mobile
    - npm install
    - if [ ! -f android/app/google-services.json ]; then if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then if [ -f "${GOOGLE_SERVICES_JSON}" ]; then cp "${GOOGLE_SERVICES_JSON}" android/app/google-services.json; else printf "%s" "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json; fi; elif [ -f "/home/alexey/projects/omd/etc/fcm/google-services.json" ]; then cp "/home/alexey/projects/omd/etc/fcm/google-services.json" android/app/google-services.json; echo "Copied local FCM google-services.json"; fi; fi
    - npx cap sync android
    - chmod +x android/gradlew || true
  script:
    # 5. Compile Android Debug APK
    - cd android
    - ./gradlew --stop
    - ./gradlew clean
    - export BUILD_NUMBER=${CI_PIPELINE_IID}
    - ./gradlew assembleDebug
    - cd ..
    # 6. Copy final APK to OnMyDisk.apk
    - cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/OnMyDisk.apk
    # 7. Upload to central binary repository
    - ssh -o StrictHostKeyChecking=no repo@forge.onmydisk.net "mkdir -p /opt/repo/OnMyDisk/Android"
    - scp -o StrictHostKeyChecking=no android/app/build/outputs/apk/debug/OnMyDisk.apk repo@forge.onmydisk.net:/opt/repo/OnMyDisk/Android/OnMyDisk.apk
  artifacts:
    paths:
      - mobile/android/app/build/outputs/apk/debug/OnMyDisk.apk
  when: manual

build-ios:
  stage: mobile
  image: node:20-bookworm
  tags:
    - linux
  script:
    - which jq >/dev/null || (apt-get update && apt-get install -y jq curl)
    - echo "Triggering Codemagic iOS cloud build for branch ${CI_COMMIT_REF_NAME}..."
    - |
      RESPONSE=$(curl -s -X POST https://api.codemagic.io/builds \
        -H "Content-Type: application/json" \
        -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
        --data "{\"appId\": \"6abe4c845eb3cd34fe4cc074\", \"workflowId\": \"ios-workflow\", \"branch\": \"${CI_COMMIT_REF_NAME}\", \"environment\": {\"variables\": {\"BUILD_NUMBER\": \"${CI_PIPELINE_IID}\"}}}")
      BUILD_ID=$(echo "$RESPONSE" | jq -r '.buildId // empty')
      if [ -z "$BUILD_ID" ]; then
        echo "Failed to start Codemagic build: $RESPONSE"
        exit 1
      fi
      echo "Codemagic build started successfully! Build ID: $BUILD_ID"
      echo "Live build logs: https://codemagic.io/app/6abe4c845eb3cd34fe4cc074/build/$BUILD_ID"
      echo "Waiting for iOS build to complete on macOS runner..."
      while true; do
        sleep 25
        BUILD_INFO=$(curl -s -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" "https://api.codemagic.io/builds/$BUILD_ID")
        STATUS=$(echo "$BUILD_INFO" | jq -r '.build.status // empty')
        echo "Current Codemagic status: $STATUS"
        if [ "$STATUS" = "finished" ]; then
          echo "iOS build completed successfully!"
          IPA_URL=$(echo "$BUILD_INFO" | jq -r '.build.artefacts[]? | select(.name | endswith(".ipa")) | .url // empty' | head -n 1)
          if [ -n "$IPA_URL" ]; then
            mkdir -p build_ios
            curl -s -L "$IPA_URL" -o build_ios/OnMyDisk.ipa
            echo "Downloaded IPA to build_ios/OnMyDisk.ipa"
            ssh -o StrictHostKeyChecking=no repo@forge.onmydisk.net "mkdir -p /opt/repo/OnMyDisk/iOS" || true
            scp -o StrictHostKeyChecking=no build_ios/OnMyDisk.ipa repo@forge.onmydisk.net:/opt/repo/OnMyDisk/iOS/OnMyDisk.ipa || true
          else
            echo "ERROR: Codemagic finished without producing an IPA artifact! Check logs: https://codemagic.io/app/6abe4c845eb3cd34fe4cc074/build/$BUILD_ID"
            exit 1
          fi
          break
        elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
          echo "iOS build $STATUS! Check logs: https://codemagic.io/app/6abe4c845eb3cd34fe4cc074/build/$BUILD_ID"
          exit 1
        fi
      done
  artifacts:
    paths:
      - build_ios/*.ipa
    expire_in: 1 week
  when: manual

deploy_mobile_ota:
  stage: deploy
  tags:
    - linux
  script:
    # 1. Install zip if not present
    - if ! [ -x "$(command -v zip)" ]; then
        if [ -x "$(command -v apt-get)" ] && [ "$(id -u)" = "0" ]; then
          apt-get update && apt-get install -y zip;
        fi
      fi
    # 2. Build Svelte Static Frontend in svar
    #    (no .gz siblings in the OTA bundle — dead weight for WebView)
    - cd svar
    - npm install --legacy-peer-deps
    - export VITE_APP_VERSION="3.0.${CI_PIPELINE_IID}"
    - COMPRESS_ASSETS=0 npm run build
    # 3. Zip the Svelte static build files (from svar/dist), excluding heavy unchanged WASM suites
    - cd dist
    - zip -r ../../omd-frontend.zip . -x "*.map" -x "*tracemonkey*" -x "wordcraft/*" -x "deckcraft/*" -x "gridcraft/*"
    - cd ../..
    # 4. Upload zip to central binary repository for live updates
    - ssh -o StrictHostKeyChecking=no repo@forge.onmydisk.net "mkdir -p /opt/repo/OnMyDisk/Android"
    - scp -o StrictHostKeyChecking=no omd-frontend.zip repo@forge.onmydisk.net:/opt/repo/OnMyDisk/Android/omd-frontend.zip
    # 5. Generate and upload version.json for OTA live update check
    - echo "{\"version\":\"3.0.${CI_PIPELINE_IID}\"}" > version.json
    - scp -o StrictHostKeyChecking=no version.json repo@forge.onmydisk.net:/opt/repo/OnMyDisk/version.json
    - scp -o StrictHostKeyChecking=no version.json repo@forge.onmydisk.net:/opt/repo/OnMyDisk/Android/version.json
  when: manual

