    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@onmydisk.net "mkdir -p /root/direct/www"
    - rsync -avzc -e "ssh -p 30333 -o StrictHostKeyChecking=no" --delete svar/dist/ $DEPLOY_USER@onmydisk.net:/root/direct/www/
    - sudo -u alexey git -C /home/alexey/projects/omd/onmydisk fetch origin direct
