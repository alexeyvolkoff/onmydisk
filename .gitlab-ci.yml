variables:
  QMAKE_OPENWRT_ARM: /data/tools/openwrt-arm/openwrt/staging_dir/toolchain-arm_cortex-a9+vfpv3-d16_gcc-8.4.0_musl_eabi/bin/qmake
  GIT_CLEAN_FLAGS: -ffdx -e build/ -e run/ -e libdatachannel/


stages:
  - build
  - build_innbox
  - deploy_innbox
  - deploy
  - mobile
  - test_automated


repair_workspace:
  stage: build
  variables:
    GIT_STRATEGY: none
  script:
    - docker run --rm -v "$(pwd)":/onmydisk alpine chown -R $(id -u):$(id -g) /onmydisk
  tags:
    - deb
  when: manual




build_openwrt_arm:
  stage: build
  variables:
    KIT_ARCH: armv7
    QTDIR: /data/tools/openwrt-arm/openwrt/staging_dir/target-arm_cortex-a9+vfpv3-d16_musl_eabi
    STAGING_DIR: /data/tools/openwrt-arm/openwrt/staging_dir/target-arm_cortex-a9+vfpv3-d16_musl_eabi
    KIT_INCLUDE: /data/tools/openwrt-arm/openwrt/staging_dir/target-arm_cortex-a9+vfpv3-d16_musl_eabi/usr/include
  script:
  - eval 'export PATH=/data/tools/openwrt-arm/openwrt/staging_dir/toolchain-arm_cortex-a9+vfpv3-d16_gcc-8.4.0_musl_eabi/bin:$PATH'
  - mkdir -p build_arm
  - pushd build_arm
  - 'eval $QMAKE_OPENWRT_ARM CONFIG+=DEPLOY DEFINES+=ROUTER BUILD_VERSION=$CI_PIPELINE_ID ../Node.pro'
  - make
  - popd
  - pushd Node
  - sed -i "s|version|2.1.5.$CI_PIPELINE_ID|g" control/control
  - sed -i "s|arch|arm_cortex-a9_vfpv3-d16|g" control/control
  - pushd control
  - tar --numeric-owner --group=0 --owner=0 -czvf ../control.tar.gz .
  - popd
  - pushd router
  - tar --numeric-owner --group=0 --owner=0 -czvf ../data.tar.gz .
  - popd
  - echo 2.0 > debian-binary
  - tar czvf onmydisk_"2.1.5.$CI_PIPELINE_ID"_armhf.ipk  control.tar.gz data.tar.gz  debian-binary
  - scp onmydisk_"2.1.5.$CI_PIPELINE_ID"_armhf.ipk repo@forge.onmydisk.net:/opt/repo/OpenWrt/onmydisk-latest-armhf.ipk
  - popd
  tags:
  - arm
  when: manual
  artifacts:
    paths:
    - Node/*.ipk
    expire_in: 1 week


