deploy_gun_hub:
  stage: deploy
  tags:
    - linux
  script:
    # Execute deployment commands remotely against the combined compose.
    # 1. Create directory for hub sources inside the integration tree
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@onmydisk.net "mkdir -p /root/direct/gun-hub"

    # 1a. Keep the combined compose file up to date
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" docker-compose.yml $DEPLOY_USER@onmydisk.net:/root/direct/

    # 1b. One-time migration of GunDB data from the old standalone location
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@onmydisk.net "if [ -d /root/direct/gun-hub/data ] && [ ! -d /root/direct/gun-hub/data ]; then cp -a /root/direct/gun-hub/data /root/direct/gun-hub/data; echo 'migrated gun-hub data'; fi"

    # 2. Sync Hub sources
    - rsync -avz -e "ssh -p 30333 -o StrictHostKeyChecking=no" --exclude 'node_modules' --exclude '.git' --exclude 'data' gun-hub/ $DEPLOY_USER@onmydisk.net:/root/direct/gun-hub/

    # 3. Remove any leftover container from the old standalone deployment
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@onmydisk.net "docker rm -f omd-gun-hub || true"

    # 4. Build (utilizing docker cache) and start the hub service
    - ssh -p 30333 -o StrictHostKeyChecking=no $DEPLOY_USER@onmydisk.net "
        cd /root/direct &&
        docker-compose build omd-gun-hub &&
        docker-compose up -d omd-gun-hub"

  when: manual








