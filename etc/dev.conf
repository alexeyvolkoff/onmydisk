[General]
docRoot=:/filemanager
davPath=dav
IndexFiles="index.html,index.htm,default.htm,default.html,iisstart.htm"
AutoIndex=true
SingleThread=false
iconDir=:/filemanager/mimetypes
mainHost=localhost
publicHost=localhost
smtphost=smtp.example.com
smtpport=587
smtplogin=
smtppass=
smtpehlo=client
LoginPage=login-key.html


[Network]
port=9000
CA=../../etc/pki/rootCA.crt
Cert=../../etc/ssl/onmydisk.local.crt
pKey=../../etc/ssl/onmydisk.local.key
