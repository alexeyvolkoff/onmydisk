pKey=../../etc/ssl/onmydisk.local.key
pKeyPass=


[Notifications]
Port=9988
Secure=false
CA=../../etc/ssl/ca.crt
Cert=../../etc/ssl/onmydisk.local.crt
pKey=../../etc/ssl/onmydisk.local.key
pKeyPass=


[PKI]
CACert=../../etc/pki/rootCA.crt
CAKey=../../etc/pki/rootCA.key
CAPass=

[AuthDB]
driver=QSQLITE
database=../../etc/onmydisk.db

