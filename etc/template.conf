[General]
Shares=
docRoot=/var/onmydisk
IndexFiles="index.html,index.htm,default.htm"
SharedIndexFiles=shared.html
AutoIndex=true
SingleThread=false
iconDir=/srv/omd/icons
PID=/tmp/onmydisk.pid
mainHost=demo.YOUR_DOMAIN
publicHost=public.YOUR_DOMAIN

[Notifications]
Enabled=true
Port=9988
Secure=true
CA=
Cert=
pKey=

[Network]
port=9000
CA=/etc/onmydisk/ssl/CA.crt
Cert=/etc/onmydisk/ssl/demo.crt
pKey=/etc/onmydisk/ssl/demo.key
pKeyPass=
[FileNode]
Enabled=true
Network=false
Socket=/run/onmydisk_node.socket
Localhost=false
Port=8080
Secure=false
CA=/etc/onmydisk/ssl/CA.crt
Cert=/etc/onmydisk/ssl/demo.crt
pKey=/etc/onmydisk/ssl/demo.key
pKeyPass=
[PKI]
LinkCACert=/etc/onmydisk/pki/rootCA.crt
CACert=/etc/onmydisk/pki/rootCA.crt
CAKey=/etc/onmydisk/pki/rootCA.key
CAPass=
